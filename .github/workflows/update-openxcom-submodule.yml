
name: Update OpenXcom Submodule

on:
  workflow_dispatch:

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout submodule separately
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        
        # 
        rm -rf app/src/main/jni/OpenXcom
        git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/namasted-cmyk/BrutalAI-OpenXcom.git app/src/main/jni/OpenXcom
        cd app/src/main/jni/OpenXcom
        git checkout android
        cd ../../../../../
        
        # 
        git add app/src/main/jni/OpenXcom
        git submodule init
        git commit -m "Update OpenXcom submodule" || exit 0
        git push
